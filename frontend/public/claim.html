<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verificar Seleção — Claim Your Package</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#070707;color:#f8f6f0;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:min(560px,100%);padding:42px 28px;border:1px solid #292929;border-radius:18px;background:#101010;box-shadow:0 25px 80px #000}
.label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d6b15a;margin-bottom:18px}
h1{font-size:clamp(35px,8vw,58px);line-height:.95;letter-spacing:-.04em;text-transform:uppercase}
p{margin-top:20px;color:#aaa;line-height:1.7;font-size:15px}
form{margin-top:30px}
input{width:100%;height:56px;padding:0 17px;border:1px solid #333;border-radius:10px;background:#080808;color:white;font-size:16px;outline:none}
input:focus{border-color:#d6b15a}
button{width:100%;height:56px;margin-top:13px;border:0;border-radius:30px;background:#f1d88a;color:#080808;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.back{display:block;margin-top:24px;text-align:center;color:#999;text-decoration:none;font-size:13px}
#result{display:none;margin-top:22px;padding:18px;border:1px solid #3b3320;border-radius:12px;background:#17130a;color:#f1d88a;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<div class="label">Claim Your Package</div>
<h1>Verifique sua seleção.</h1>
<p>Digite o seu nome para iniciar a verificação da seleção.</p>

<form id="claimForm">
<input id="name" type="text" placeholder="Seu nome" required autocomplete="name">
<button type="submit">Verificar agora</button>
</form>

<div id="result"></div>

<a class="back" href="/">← Voltar para a página inicial</a>
</div>

<script>
document.getElementById("claimForm").addEventListener("submit",function(e){
e.preventDefault();
const name=document.getElementById("name").value.trim();
const result=document.getElementById("result");
if(!name)return;
result.style.display="block";
result.innerHTML="Obrigado, <strong>"+name.replace(/[<>]/g,"")+"</strong>.<br><br>A sua verificação foi recebida. Siga as próximas instruções para continuar.";
});
</script>
</body>
</html>
